[workspace]
members = [
    "crates/xyzterm-path",
    "crates/terminal-engine",
    "crates/terminal-pty",
    "crates/rootfs-manager",
    "crates/backup-engine",
    "crates/proot-elf",
    "crates/proot-syscall",
    "crates/proot-ptrace",
    "crates/proot-loader",
    "crates/proot-extensions",
    "crates/link2symlink-compat",
    "crates/proot-fake-id0",
    "crates/proot-sysvipc",
    "crates/proot-runtime",
    "crates/proot-extensions-extra",
    "app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
