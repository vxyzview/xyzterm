[package]
name = "link2symlink-compat"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-testable link2symlink semantics shared by the C++ shim and the PRoot extension"

[dependencies]
xyzterm-path = { path = "../xyzterm-path" }
proot-syscall = { path = "../proot-syscall" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
