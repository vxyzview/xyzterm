name: PR Check

# PRs used to get formatting only: android.yml builds on tags and
# build-pixeldrain.yml builds on pushes to main, so a PR could merge
# without ever compiling. This job compiles and runs unit tests on PRs.
on:
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Rust toolchain for JNI build
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android NDK 30.0.16248370
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug and run unit tests
        run: ./gradlew assembleDebug test --no-daemon --warning-mode all
