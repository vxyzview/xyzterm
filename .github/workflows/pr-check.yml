name: PR Check

# PRs used to get formatting only: android.yml builds on tags and
# build-pixeldrain.yml builds on pushes to main, so a PR could merge
# without ever compiling. This job compiles and runs unit tests on PRs.
on:
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-libs:
    name: Native libraries
    uses: ./.github/workflows/rust-migration.yml

  build-and-test:
    runs-on: ubuntu-latest
    needs: native-libs
    # Fallback: a failed Rust job still leaves an APK buildable as before.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download native libraries
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: jni-libs
          path: app/src

      - name: Verify native libraries
        env:
          REQUIRE_NATIVE_LIBS: ${{ vars.REQUIRE_NATIVE_LIBS }}
        run: |
          set -euo pipefail
          arm="app/src/arm/jniLibs/armeabi-v7a/libxyzterm.so"
          arm64="app/src/arm64/jniLibs/arm64-v8a/libxyzterm.so"
          if [ -f "$arm" ] && [ -f "$arm64" ]; then
            echo "libxyzterm.so staged for both ABIs."
          elif [ "${REQUIRE_NATIVE_LIBS:-false}" = "true" ]; then
            echo "::error::libxyzterm.so is missing while REQUIRE_NATIVE_LIBS=true"
            exit 1
          else
            echo "::warning::libxyzterm.so missing - building as before without native libraries."
          fi

      - name: Build debug and run unit tests
        run: ./gradlew assembleDebug test --no-daemon --warning-mode all
