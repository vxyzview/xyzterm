name: Kotlin format

# Two different jobs on purpose.
#
# On `dev` this only CHECKS. The workflow historically auto-formatted and pushed back, which on
# a working branch means: push -> format -> commit -> push -> format -> ... a self-sustaining
# loop that rewrites history under anyone with the branch checked out. Checking is the safe
# behaviour for a shared branch.
#
# On `main` the auto-format commit is kept, because that branch is the one people land on and
# it is not a working branch.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Check Kotlin formatting
        run: ./gradlew ktfmtCheck

  format-main:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run ktfmt format
        run: ./gradlew ktfmtFormat

      - name: Commit formatted code
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format Kotlin with ktfmt"
            git push
          else
            echo "No formatting changes"
          fi