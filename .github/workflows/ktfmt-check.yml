name: Auto format Kotlin (ktfmt)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 👈 Allows manual run from GitHub UI

concurrency:
  group: ktfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ktfmt:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run ktfmt format
        run: ./gradlew ktfmtFormat --no-daemon --warning-mode all

      - name: Commit formatted code
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format Kotlin with ktfmt"
            # Another push may have landed while formatting ran; rebase or the push is rejected.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No formatting changes"
          fi