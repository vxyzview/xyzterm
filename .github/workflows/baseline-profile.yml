name: Baseline profile

# Regenerates the baseline profile on a managed emulator and commits it back.
# Run manually from the Actions tab after meaningful startup-path changes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6

      # The baseline profile plugin builds nonMinifiedRelease/benchmarkRelease
      # variants of :app, which inherit the release signing config.
      - name: Generate signing key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore /tmp/xyzterm.keystore \
            -alias xyzterm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
          cat > /tmp/signing.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=xyzterm
          storeFile=/tmp/xyzterm.keystore
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate baseline profiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          script: ./gradlew :app:generateBaselineProfile --no-daemon --no-configuration-cache

      - name: Upload profile artifact
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profiles
          path: app/src/main/generated/baselineProfiles/

      - name: Collect generated profile into src
        run: |
          mkdir -p app/src/main/generated/baselineProfiles
          # The plugin's copy task can restore a stale cache hit; collect
          # deterministically from this run's build outputs instead.
          # Generated files use the ART name (baseline-prof.txt); the source
          # set expects baselineprof.txt. Prefer the merged profile.
          FOUND=$(find baselineprofile app -path "*build*" -name "baseline-prof.txt" 2>/dev/null | grep -i "merged_art_profile" | head -n 1)
          if [ -z "$FOUND" ]; then
            FOUND=$(find baselineprofile app -path "*build*" \( -name "baseline-prof.txt" -o -name "baselineprof.txt" \) 2>/dev/null | grep -i release | head -n 1)
          fi
          if [ -z "$FOUND" ]; then
            FOUND=$(find baselineprofile app -path "*build*" \( -name "baseline-prof.txt" -o -name "baselineprof.txt" \) 2>/dev/null | head -n 1)
          fi
          if [ -n "$FOUND" ]; then
            echo "Copying $FOUND"
            cp "$FOUND" app/src/main/generated/baselineProfiles/baselineprof.txt
            wc -l app/src/main/generated/baselineProfiles/baselineprof.txt
          else
            echo "No profile under any build/ dir."
            exit 1
          fi

      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/generated/baselineProfiles
          git diff --cached --quiet || (git commit -m "chore: regenerate baseline profile" && git push)
