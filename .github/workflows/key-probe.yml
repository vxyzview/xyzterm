name: Key Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Export encrypted backup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/live.keystore
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 \
            -salt -in /tmp/live.keystore -out /tmp/live.keystore.enc -pass env:KEYSTORE_PASSWORD
          rm /tmp/live.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: live-keystore-enc
          path: /tmp/live.keystore.enc
          retention-days: 1
