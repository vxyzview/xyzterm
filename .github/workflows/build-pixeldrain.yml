name: Build & Upload to PixelDrain

# Builds a signed release APK on every push to dev/main and uploads it to
# PixelDrain (no GitHub artifact / release). Doc-only pushes are skipped.
# Separate from android.yml (which builds tagged releases).

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Persistent release identity: every build signs with the same key,
            # so updates install over each other and Play Protect reputation
            # accumulates on one certificate.
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xyzterm.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > /tmp/signing.properties
            echo "Using persistent release signing key from repo secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - generating an EPHEMERAL key; this build cannot update over any other build!"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore /tmp/xyzterm.keystore \
              -alias xyzterm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$PASS" "$PASS" > /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install rust-anything CLI
        run: cargo install rust-anything --version 3.2.0 --locked

      - name: Build Rust JNI library
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          NDK_VERSION=$(grep -rhoE '"[0-9]+\.[0-9]+\.[0-9]+"' features/terminal/link2symlink/build.gradle.kts | tr -d '"' | sed -n '1p')
          [ -n "$NDK_VERSION" ] || NDK_VERSION=30.0.16248370
          SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null | sed -n '1p')
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          if [ ! -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION"
          fi
          rust-anything build rust/portable-rs --profile android \
            --ndk "$SDK_ROOT/ndk/$NDK_VERSION" --api 26 \
            --abi arm64-v8a --abi armeabi-v7a --abi x86_64 \
            --jni-libs features/terminal/src/main/jniLibs

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon && mv app/build/outputs/apk/release/*.apk app/xyzterm-release.apk
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      # aapt renames and decompresses gz assets listed in noCompress; the app
      # opens the .tar.gz name, so fail the build if that ever changes again.
      - name: Verify bundled rootfs assets
        run: |
          unzip -l app/xyzterm-release.apk | grep -q "assets/terminal/archm-arm64.tar.gz"
          unzip -l app/xyzterm-release.apk | grep -q "assets/terminal/archm-arm.tar.gz"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Got version: $VERSION"

      # Per-commit upload target: <version>-<commit>.apk so each build is distinct.
      - name: Rename APK with version + commit
        run: mv app/xyzterm-release.apk "app/xyzterm-${{ env.VERSION }}-${{ env.COMMIT_HASH }}.apk"

      - name: Upload APK to PixelDrain
        if: ${{ success() }}
        timeout-minutes: 15
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VERSION: ${{ env.VERSION }}
          COMMIT_HASH: ${{ env.COMMIT_HASH }}
        run: |
          RESP=$(curl -s -T "app/xyzterm-$VERSION-$COMMIT_HASH.apk" \
            -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/file/")
          echo "PixelDrain response: $RESP"
          ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -n "$ID" ]; then
            echo "APK uploaded: https://pixeldrain.com/u/$ID"
            echo "Version: $VERSION"
            echo "Commit: $COMMIT_MSG"
          else
            # A revoked/expired key must not fail the whole build; the APK is
            # still produced and the GitHub release path is unaffected.
            echo "::warning::PixelDrain upload failed: $RESP"
          fi
