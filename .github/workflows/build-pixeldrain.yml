name: Build & Upload to PixelDrain

# Builds a signed release APK on every push to dev/main and uploads it to
# PixelDrain (no GitHub artifact / release). Doc-only pushes are skipped.
# Separate from android.yml (which builds tagged releases).

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-libs:
    name: Native libraries
    uses: ./.github/workflows/rust-migration.yml

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: native-libs
    # Fallback: a failed Rust job still leaves an APK buildable as before.
    if: ${{ !cancelled() }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Persistent release identity: every build signs with the same key,
            # so updates install over each other and Play Protect reputation
            # accumulates on one certificate.
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xyzterm.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > /tmp/signing.properties
            echo "Using persistent release signing key from repo secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - generating an EPHEMERAL key; this build cannot update over any other build!"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore /tmp/xyzterm.keystore \
              -alias xyzterm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$PASS" "$PASS" > /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download native libraries
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: jni-libs
          path: app/src

      - name: Verify native libraries
        env:
          REQUIRE_NATIVE_LIBS: ${{ vars.REQUIRE_NATIVE_LIBS }}
        run: |
          set -euo pipefail
          arm="app/src/arm/jniLibs/armeabi-v7a/libxyzterm.so"
          arm64="app/src/arm64/jniLibs/arm64-v8a/libxyzterm.so"
          if [ -f "$arm" ] && [ -f "$arm64" ]; then
            echo "libxyzterm.so staged for both ABIs."
          elif [ "${REQUIRE_NATIVE_LIBS:-false}" = "true" ]; then
            echo "::error::libxyzterm.so is missing while REQUIRE_NATIVE_LIBS=true"
            exit 1
          else
            echo "::warning::libxyzterm.so missing - building as before without native libraries."
          fi

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon --warning-mode all
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Verify per-ABI rootfs assets
        run: |
          for abi in arm arm64; do
            apk=$(find "app/build/outputs/apk/$abi/release" -name '*.apk' | head -1)
            echo "=== $apk ==="
            unzip -l "$apk" | grep "assets/terminal/" || true
            unzip -l "$apk" | grep -q "assets/terminal/rootfs-$abi.zip"
            unzip -l "$apk" | grep -q "assets/terminal/rootfs-$abi.tsv"
            other=$([ "$abi" = arm ] && echo arm64 || echo arm)
            if unzip -l "$apk" | grep -q "assets/terminal/rootfs-$other.zip"; then
              echo "Wrong rootfs bundled in $apk" >&2
              exit 1
            fi
          done

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Got version: $VERSION"

      # Per-commit upload target: <version>-<commit>.apk so each build is distinct.
      - name: Rename APKs with version + commit
        run: |
          for abi in arm arm64; do
            apk=$(find "app/build/outputs/apk/$abi/release" -name '*.apk' | head -1)
            mv "$apk" "app/xyzterm-${{ env.VERSION }}-${{ env.COMMIT_HASH }}-$abi.apk"
          done

      - name: Upload APK to PixelDrain
        if: ${{ success() && needs.native-libs.result == 'success' }}
        timeout-minutes: 15
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VERSION: ${{ env.VERSION }}
          COMMIT_HASH: ${{ env.COMMIT_HASH }}
        run: |
          for abi in arm arm64; do
            FILE="app/xyzterm-$VERSION-$COMMIT_HASH-$abi.apk"
            RESP=$(curl -s -T "$FILE" \
              -u ":$PIXELDRAIN_API_KEY" \
              "https://pixeldrain.com/api/file/")
            echo "$abi PixelDrain response: $RESP"
            ID=$(echo "$RESP" | jq -r '.id // empty')
            if [ -n "$ID" ]; then
              echo "$abi APK uploaded: https://pixeldrain.com/u/$ID"
            else
              # A revoked/expired key must not fail the whole build.
              echo "::warning::PixelDrain upload failed for $abi: $RESP"
            fi
          done
          echo "Version: $VERSION"
          echo "Commit: $COMMIT_MSG"
