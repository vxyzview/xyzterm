name: Macrobenchmark

# Measures cold startup (with vs without baseline profiles) on a managed
# emulator. Run manually from the Actions tab after startup-path changes
# to confirm the checked-in baseline profile still pays off.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run macrobenchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate signing key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore /tmp/xyzterm.keystore \
            -alias xyzterm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
          cat > /tmp/signing.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=xyzterm
          storeFile=/tmp/xyzterm.keystore
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run cold-startup benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          script: ./gradlew :macrobenchmark:connectedNonMinifiedReleaseAndroidTest --no-daemon --no-configuration-cache

      - name: Show startup numbers
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, json
          for f in sorted(glob.glob("macrobenchmark/build/outputs/**/benchmarkData.json", recursive=True)):
              print("== " + f)
              try:
                  data = json.load(open(f))
                  benches = data if isinstance(data, list) else data.get("benchmarks", [])
                  for b in benches:
                      metrics = b.get("metrics", {})
                      tid = metrics.get("timeToInitialDisplayMs", {})
                      print("  " + str(b.get("name")) + " timeToInitialDisplayMs median=" + str(tid.get("median")) + " min=" + str(tid.get("minimum")))
              except Exception as e:
                  print("  (unparsed: " + str(e) + ")")
          EOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-results
          path: macrobenchmark/build/outputs/connected_android_test_additional_output/
