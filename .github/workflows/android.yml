name: Android CI

# VERSION: 2 - auto-generates signing key; no KEYSTORE/PROP secrets needed.
# If a run log shows "KEYSTORE secret is not a valid keystore" or "Verify signing
# key", it is using a STALE cached workflow - re-run on this commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  native-libs:
    name: Native libraries
    uses: ./.github/workflows/rust-migration.yml

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: native-libs
    # Fallback: a failed Rust job still leaves an APK buildable as before.
    if: ${{ !cancelled() }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Persistent release identity: every build signs with the same key,
            # so updates install over each other and Play Protect reputation
            # accumulates on one certificate.
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xyzterm.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > /tmp/signing.properties
            echo "Using persistent release signing key from repo secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - generating an EPHEMERAL key; this build cannot update over any other build!"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore /tmp/xyzterm.keystore \
              -alias xyzterm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$PASS" "$PASS" > /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download native libraries
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: jni-libs
          path: app/src

      - name: Verify native libraries
        env:
          REQUIRE_NATIVE_LIBS: ${{ vars.REQUIRE_NATIVE_LIBS }}
        run: |
          set -euo pipefail
          arm="app/src/arm/jniLibs/armeabi-v7a/libxyzterm.so"
          arm64="app/src/arm64/jniLibs/arm64-v8a/libxyzterm.so"
          if [ -f "$arm" ] && [ -f "$arm64" ]; then
            echo "libxyzterm.so staged for both ABIs."
          elif [ "${REQUIRE_NATIVE_LIBS:-false}" = "true" ]; then
            echo "::error::libxyzterm.so is missing while REQUIRE_NATIVE_LIBS=true"
            exit 1
          else
            echo "::warning::libxyzterm.so missing - building as before without native libraries."
          fi

      - name: Run unit tests
        run: ./gradlew :features:terminal:testDebugUnitTest --no-daemon --warning-mode all

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon --warning-mode all
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Got version: $VERSION"

      - name: Rename APKs with version
        run: |
          for abi in arm arm64; do
            apk=$(find "app/build/outputs/apk/$abi/release" -name '*.apk' | head -1)
            mv "$apk" "app/xyzterm-${{ env.VERSION }}-$abi.apk"
          done

      - name: Create GitHub Release
        id: release
        if: ${{ success() && needs.native-libs.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION }}"
          # Published releases are immutable: each version is tagged and
          # uploaded exactly once, from the exact commit that built it.
          # Reproducible-build verification (F-Droid Binaries) depends on
          # the asset never changing after publication.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already published - skipping (immutable)."
            exit 0
          fi
          # The tag may already exist when this run was triggered by pushing
          # it manually; only create it when missing (never move a published
          # tag — releases are immutable, see the check below).
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - using it."
          else
            git tag "$TAG" "${{ env.COMMIT_HASH }}"
            git push origin "refs/tags/$TAG"
          fi
          PRERELEASE_FLAG=""
          case "${{ env.VERSION }}" in
            *-* ) PRERELEASE_FLAG="--prerelease" ;;
          esac
          NOTES_FILE="$RUNNER_TEMP/xyzterm-release-notes.md"
          cat > "$NOTES_FILE" <<'RELEASE_NOTES'
          ## xyzterm __VERSION__ — backups, terminal UX and lean-up

          ### Fixed
          - Restore accepts the real Arch image: guest-relative `..` links and guest-absolute links such as the `/dev/null` pacman hook masks are no longer rejected. The installer now creates those masks too.
          - Crafted archives can no longer escape the staging tree through symlinks in backup metadata; host-side reads and config writes never follow links.
          - The Quick Settings tile now appears — `BIND_QUICK_SETTINGS_TILE` is enforced on the tile service instead of declared as a permission.
          - Copy all / Share no longer fail on large scrollback; oversized text is shared through a FileProvider cache file, with normal copy/paste kept as plain text.
          - Session restore shows the active shell first while still waiting for every shell before declaring the restore complete.
          - CI compiles again on `minSdk 26`; a Kotlin nullability warning was cleared.

          ### Added
          - Auto-backups can be mirrored to a user-picked SAF folder so they survive uninstall; light mode saves the home plus `pacman -Qqe` instead of the whole rootfs.
          - Auto-backup checks free space and schedules with battery/storage constraints.
          - Live title and working directory in the toolbar, opt-in command-finished notifications, exit codes on session end, wrapped-URL taps and a default-shell setting.

          ### Changed
          - PBKDF2 raised to 600k iterations with a versioned header that still reads older archives.
          - The bundled rootfs drops about 100 MB of unused hwdata/udev/xtables/gir/man data; dead dependencies and blanket R8 keeps removed.

          ### Requirements and install
          - Android 8.0+ (`minSdk 26`), `arm64-v8a` or `armeabi-v7a`. x86_64 is not supported.
          - Install `xyzterm-__VERSION__-arm64.apk` (arm64) or `xyzterm-__VERSION__-arm.apk` (armv7). The rootfs is bundled and staged locally on first launch; there is no download.

          Licensed under GPL-3.0-or-later. Built from source on GitHub Actions.
          RELEASE_NOTES
          # The heredoc is quoted to keep backticks literal; substitute the real
          # version afterwards so notes never advertise the previous release.
          sed -i "s/__VERSION__/${VERSION}/g" "$NOTES_FILE"
          printf '\nBuilt from commit `%s`. APKs: `xyzterm-%s-arm.apk` (armv7) and `xyzterm-%s-arm64.apk` (arm64). F-Droid metadata: [fdroid/metadata/com.xyzterm.app.yml](fdroid/metadata/com.xyzterm.app.yml).\n' \
            "${{ env.COMMIT_HASH }}" "${{ env.VERSION }}" "${{ env.VERSION }}" >> "$NOTES_FILE"
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            "app/xyzterm-${{ env.VERSION }}-arm.apk" \
            "app/xyzterm-${{ env.VERSION }}-arm64.apk" \
            --title "xyzterm ${{ env.VERSION }}" \
            $PRERELEASE_FLAG \
            --notes-file "$NOTES_FILE" \
            --repo "${{ github.repository }}"

