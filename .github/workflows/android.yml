name: Android CI

# VERSION: 2 - auto-generates signing key; no KEYSTORE/PROP secrets needed.
# If a run log shows "KEYSTORE secret is not a valid keystore" or "Verify signing
# key", it is using a STALE cached workflow - re-run on this commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Persistent release identity: every build signs with the same key,
            # so updates install over each other and Play Protect reputation
            # accumulates on one certificate.
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xyzterm.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > /tmp/signing.properties
            echo "Using persistent release signing key from repo secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - generating an EPHEMERAL key; this build cannot update over any other build!"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore /tmp/xyzterm.keystore \
              -alias xyzterm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$PASS" "$PASS" > /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install rust-anything CLI
        run: cargo install rust-anything --version 3.2.0 --locked

      - name: Build Rust JNI library
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          NDK_VERSION=$(grep -rhoE '"[0-9]+\.[0-9]+\.[0-9]+"' features/terminal/link2symlink/build.gradle.kts | tr -d '"' | sed -n '1p')
          [ -n "$NDK_VERSION" ] || NDK_VERSION=30.0.16248370
          SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null | sed -n '1p')
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          if [ ! -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION"
          fi
          rust-anything build rust/portable-rs --profile android \
            --ndk "$SDK_ROOT/ndk/$NDK_VERSION" --api 26 \
            --abi arm64-v8a --abi armeabi-v7a --abi x86_64 \
            --jni-libs features/terminal/src/main/jniLibs

      - name: Run unit tests
        run: ./gradlew :features:terminal:testDebugUnitTest --no-daemon --warning-mode all

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon --warning-mode all
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Got version: $VERSION"

      - name: Rename APKs with version
        run: |
          for abi in arm arm64; do
            apk=$(find "app/build/outputs/apk/$abi/release" -name '*.apk' | head -1)
            mv "$apk" "app/xyzterm-${{ env.VERSION }}-$abi.apk"
          done

      - name: Create GitHub Release
        id: release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION }}"
          # Published releases are immutable: each version is tagged and
          # uploaded exactly once, from the exact commit that built it.
          # Reproducible-build verification (F-Droid Binaries) depends on
          # the asset never changing after publication.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already published - skipping (immutable)."
            exit 0
          fi
          # The tag may already exist when this run was triggered by pushing
          # it manually; only create it when missing (never move a published
          # tag — releases are immutable, see the check below).
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - using it."
          else
            git tag "$TAG" "${{ env.COMMIT_HASH }}"
            git push origin "refs/tags/$TAG"
          fi
          PRERELEASE_FLAG=""
          case "${{ env.VERSION }}" in
            *-* ) PRERELEASE_FLAG="--prerelease" ;;
          esac
          NOTES_FILE="$RUNNER_TEMP/xyzterm-release-notes.md"
          cat > "$NOTES_FILE" <<'RELEASE_NOTES'
          ## xyzterm 1.0.4 — cleaner first run, small fixes

          A polish release on top of 1.0.3. The shell, bundled Arch Linux userspace, sessions, binds, backups and privacy posture are unchanged.

          ### Changed
          - First-run setup screens have wider cards and better side spacing, so text wraps less on phones.
          - About and Support now use the same tonal icon tiles as every other settings category.
          - The pale idle strip beside inactive session names in the terminal drawer is gone; the active session keeps its accent.
          - README and repository metadata now describe the current Arch Linux build.

          ### Requirements and install
          - Android 8.0+ (`minSdk 26`), `arm64-v8a` or `armeabi-v7a`. x86_64 is not supported.
          - Install `xyzterm-1.0.4-arm64.apk` (arm64) or `xyzterm-1.0.4-arm.apk` (armv7). The rootfs is bundled and staged locally on first launch; there is no download.
          - Signed with the repository's persistent key, so it installs over earlier releases.

          Licensed under GPL-3.0-or-later. Built from source on GitHub Actions.
          RELEASE_NOTES
          printf '\nBuilt from commit `%s`. APKs: `xyzterm-%s-arm.apk` (armv7) and `xyzterm-%s-arm64.apk` (arm64). F-Droid metadata: [fdroid/metadata/com.xyzterm.app.yml](fdroid/metadata/com.xyzterm.app.yml).\n' \
            "${{ env.COMMIT_HASH }}" "${{ env.VERSION }}" "${{ env.VERSION }}" >> "$NOTES_FILE"
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            "app/xyzterm-${{ env.VERSION }}-arm.apk" \
            "app/xyzterm-${{ env.VERSION }}-arm64.apk" \
            --title "xyzterm ${{ env.VERSION }}" \
            $PRERELEASE_FLAG \
            --notes-file "$NOTES_FILE" \
            --repo "${{ github.repository }}"

