name: Android CI

# VERSION: 2 - auto-generates signing key; no KEYSTORE/PROP secrets needed.
# If a run log shows "KEYSTORE secret is not a valid keystore" or "Verify signing
# key", it is using a STALE cached workflow - re-run on this commit.

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Persistent release identity: every build signs with the same key,
            # so updates install over each other and Play Protect reputation
            # accumulates on one certificate.
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xyzterm.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$KEYSTORE_PASSWORD" > /tmp/signing.properties
            echo "Using persistent release signing key from repo secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - generating an EPHEMERAL key; this build cannot update over any other build!"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore /tmp/xyzterm.keystore \
              -alias xyzterm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$PASS" > /tmp/signing.properties
          fi
          export PATH="/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH"
          SHA=$(sha256sum /tmp/xyzterm.keystore | cut -c1-16)
          AL=$(grep '^keyAlias=' /tmp/signing.properties | cut -d= -f2)
          SP=$(grep '^storePassword=' /tmp/signing.properties | cut -d= -f2)
          KP=$(grep '^keyPassword=' /tmp/signing.properties | cut -d= -f2)
          echo "DEBUG ks-sha=$SHA alias-len=${#AL} sp-len=${#SP} kp-len=${#KP} sp==kp=$([ "$SP" = "$KP" ] && echo yes || echo NO)"
          if keytool -list -keystore /tmp/xyzterm.keystore -storepass "$SP" >/dev/null 2>&1; then echo "DEBUG store-open=OK"; else echo "DEBUG store-open=FAIL"; fi
          if keytool -list -keystore /tmp/xyzterm.keystore -alias "$AL" -storepass "$SP" >/dev/null 2>&1; then echo "DEBUG key-entry=OK"; else echo "DEBUG key-entry=FAIL"; fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon && mv app/build/outputs/apk/release/*.apk app/xyzterm-release.apk
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Got version: $VERSION"

      - name: Rename APK with version
        run: mv app/xyzterm-release.apk "app/xyzterm-${{ env.VERSION }}.apk"

      - name: Create GitHub Release
        id: release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION }}"
          # Create or update the release for this version tag.
          gh release create "$TAG" \
            "app/xyzterm-${{ env.VERSION }}.apk" \
            --title "xyzterm ${{ env.VERSION }}" \
            --notes "Automated build of commit \`${{ env.COMMIT_HASH }}\`.**APK:** \`xyzterm-${{ env.VERSION }}.apk\`F-Droid: built from source via [metadata](fdroid/metadata/com.xyzterm.app.yml)." \
            --repo "${{ github.repository }}" \
            --generate-notes || \
          gh release upload "$TAG" \
            "app/xyzterm-${{ env.VERSION }}.apk" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Upload APK to PixelDrain
        if: ${{ success() }}
        timeout-minutes: 15
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VERSION: ${{ env.VERSION }}
        run: |
          RESP=$(curl -s -T "app/xyzterm-$VERSION.apk" \
            -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/file/")
          echo "PixelDrain response: $RESP"
          ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -n "$ID" ]; then
            echo "APK uploaded: https://pixeldrain.com/u/$ID"
            echo "Version: $VERSION"
            echo "Commit: $COMMIT_MSG"
          else
            echo "Upload failed: $RESP" >&2
            exit 1
          fi

