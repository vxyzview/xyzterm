name: Android CI

# VERSION: 2 - auto-generates signing key; no KEYSTORE/PROP secrets needed.
# If a run log shows "KEYSTORE secret is not a valid keystore" or "Verify signing
# key", it is using a STALE cached workflow - re-run on this commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Persistent release identity: every build signs with the same key,
            # so updates install over each other and Play Protect reputation
            # accumulates on one certificate.
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xyzterm.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > /tmp/signing.properties
            echo "Using persistent release signing key from repo secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - generating an EPHEMERAL key; this build cannot update over any other build!"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore /tmp/xyzterm.keystore \
              -alias xyzterm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=xyzterm, OU=xyzterm, O=xyzterm, L=, ST=, C=US"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=xyzterm\nstoreFile=/tmp/xyzterm.keystore\n' "$PASS" "$PASS" > /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon && mv app/build/outputs/apk/release/*.apk app/xyzterm-release.apk
        env:
          KEYSTORE_FILE: /tmp/xyzterm.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Got version: $VERSION"

      - name: Rename APK with version
        run: mv app/xyzterm-release.apk "app/xyzterm-${{ env.VERSION }}.apk"

      - name: Create GitHub Release
        id: release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION }}"
          # Published releases are immutable: each version is tagged and
          # uploaded exactly once, from the exact commit that built it.
          # Reproducible-build verification (F-Droid Binaries) depends on
          # the asset never changing after publication.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already published - skipping (immutable)."
            exit 0
          fi
          # The tag may already exist when this run was triggered by pushing
          # it manually; only create it when missing (never move a published
          # tag — releases are immutable, see the check below).
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - using it."
          else
            git tag "$TAG" "${{ env.COMMIT_HASH }}"
            git push origin "refs/tags/$TAG"
          fi
          PRERELEASE_FLAG=""
          case "${{ env.VERSION }}" in
            *-* ) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            "app/xyzterm-${{ env.VERSION }}.apk" \
            --title "xyzterm ${{ env.VERSION }}" \
            $PRERELEASE_FLAG \
            --notes "Automated build of commit \`${{ env.COMMIT_HASH }}\`.**APK:** \`xyzterm-${{ env.VERSION }}.apk\`F-Droid: built from source via [metadata](fdroid/metadata/com.xyzterm.app.yml)." \
            --repo "${{ github.repository }}"

